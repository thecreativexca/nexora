<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#ffffff" />
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Central Shield Emblem -->
  <g filter="url(#badgeShadow)" transform="translate(250, 230)">
    <!-- Outer Shield -->
    <path d="M 0 -150 Q 110 -150 140 -80 Q 140 60 0 160 Q -140 60 -140 -80 Q -110 -150 0 -150 Z" 
          fill="url(#goldGrad)" />
    <!-- Inner Shield -->
    <path d="M 0 -136 Q 98 -136 124 -74 Q 124 50 0 142 Q -124 50 -124 -74 Q -98 -136 0 -136 Z" 
          fill="url(#shieldGrad)" />
    
    <!-- Stars -->
    <g fill="#fbbf24">
      <polygon points="0,-115 4,-102 18,-102 6,-94 11,-80 0,-88 -11,-80 -6,-94 -18,-102 -4,-102" />
      <polygon transform="translate(-40, 10) scale(0.7)" points="0,-115 4,-102 18,-102 6,-94 11,-80 0,-88 -11,-80 -6,-94 -18,-102 -4,-102" />
      <polygon transform="translate(40, 10) scale(0.7)" points="0,-115 4,-102 18,-102 6,-94 11,-80 0,-88 -11,-80 -6,-94 -18,-102 -4,-102" />
    </g>

    <!-- Number 2 and Text -->
    <text x="0" y="-10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="-2">2</text>
    <text x="0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#fbbf24" letter-spacing="2">YEARS</text>
    <text x="0" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c7d2fe" letter-spacing="1">EXTENDED CARE</text>

    <!-- Verified Checkmark Icon -->
    <circle cx="0" cy="100" r="20" fill="#10b981" />
    <path d="M -8 100 L -2 106 L 8 94" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Ribbon / Guarantee Banner -->
  <g transform="translate(250, 420)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#18181b" stroke="#f59e0b" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">100% HARDWARE PROTECTION</text>
  </g>
</svg>
