<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#ffffff" />
  <defs>
    <linearGradient id="phoneA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="phoneB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Left Phone (Source) -->
  <g filter="url(#shadow)" transform="translate(140, 240) rotate(-10)">
    <rect x="-65" y="-130" width="130" height="260" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="-56" y="-118" width="112" height="236" rx="18" fill="url(#phoneA)" />
    <!-- Screen content -->
    <circle cx="0" cy="-50" r="22" fill="#ffffff" opacity="0.9" />
    <path d="M -10 -50 L 0 -60 L 10 -50 M 0 -60 L 0 -38" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="-35" y="-10" width="70" height="8" rx="4" fill="#ffffff" opacity="0.8" />
    <rect x="-25" y="6" width="50" height="6" rx="3" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Right Phone (Destination) -->
  <g filter="url(#shadow)" transform="translate(360, 240) rotate(10)">
    <rect x="-65" y="-130" width="130" height="260" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="-56" y="-118" width="112" height="236" rx="18" fill="url(#phoneB)" />
    <!-- Screen content -->
    <circle cx="0" cy="-50" r="22" fill="#ffffff" opacity="0.9" />
    <path d="M -10 -48 L 0 -38 L 10 -48 M 0 -38 L 0 -60" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="-35" y="-10" width="70" height="8" rx="4" fill="#ffffff" opacity="0.8" />
    <rect x="-25" y="6" width="50" height="6" rx="3" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Dynamic Transfer Particles / Cable Bridge in center -->
  <g transform="translate(250, 240)">
    <!-- Cable arc -->
    <path d="M -80 0 C -40 -60, 40 -60, 80 0" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" stroke-dasharray="10,6" />
    <circle cx="0" cy="-45" r="26" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <path d="M -8 -45 L 8 -45 M 2 -52 L 9 -45 L 2 -38" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Badge banner -->
  <g transform="translate(250, 420)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#18181b" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">ZERO DATA LOSS GUARANTEED</text>
  </g>
</svg>
