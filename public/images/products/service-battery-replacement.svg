<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#ffffff" />
  <defs>
    <linearGradient id="batteryBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="chargeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="batShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Central Battery Cell -->
  <g filter="url(#batShadow)" transform="translate(250, 230)">
    <!-- Battery Top Terminal -->
    <rect x="-35" y="-155" width="70" height="20" rx="8" fill="#52525b" />
    <!-- Battery Main Body -->
    <rect x="-95" y="-140" width="190" height="270" rx="28" fill="url(#batteryBody)" stroke="#3f3f46" stroke-width="3" />
    
    <!-- Full Charge Gauge Level -->
    <rect x="-80" y="-124" width="160" height="238" rx="20" fill="#09090b" />
    <rect x="-75" y="-118" width="150" height="226" rx="16" fill="url(#chargeGreen)" opacity="0.85" />
    
    <!-- Dynamic Lightning Bolt In Center -->
    <polygon points="12,-45 -22,10 -2,10 -12,50 22,-5 2,-5" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.3))" />

    <!-- 100% Health Pill -->
    <rect x="-55" y="65" width="110" height="28" rx="14" fill="#09090b" opacity="0.8" />
    <text x="0" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#22c55e">100% HEALTH</text>
  </g>

  <!-- Replacement Tools Accent -->
  <g transform="translate(85, 270) rotate(-28)">
    <rect x="0" y="0" width="12" height="110" rx="6" fill="#0f172a" />
    <rect x="2" y="10" width="8" height="30" rx="2" fill="#22c55e" />
    <path d="M 6 110 L 6 135" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Banner at bottom -->
  <g transform="translate(250, 420)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#18181b" stroke="#22c55e" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">OEM CERTIFIED CELL</text>
  </g>
</svg>
