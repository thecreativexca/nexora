<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#ffffff" />
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Smartphone Frame -->
  <g filter="url(#softShadow)">
    <rect x="155" y="70" width="190" height="360" rx="34" fill="url(#bodyGrad)" stroke="#3f3f46" stroke-width="3" />
    <!-- Screen Glass -->
    <rect x="165" y="82" width="170" height="336" rx="26" fill="url(#screenGrad)" />
    <!-- Dynamic Island / Speaker -->
    <rect x="220" y="92" width="60" height="14" rx="7" fill="#09090b" />
    
    <!-- Repair Laser / Screen Replacement Visuals -->
    <path d="M 165 240 L 335 240" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />
    <circle cx="250" cy="240" r="38" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4,3" opacity="0.8" />
    <circle cx="250" cy="240" r="22" fill="#ffffff" opacity="0.9" />
    <path d="M 242 240 L 248 246 L 260 234" fill="none" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Precision Repair Tools -->
  <g transform="translate(90, 260) rotate(-35)">
    <rect x="0" y="0" width="16" height="130" rx="8" fill="#1e293b" />
    <rect x="3" y="12" width="10" height="40" rx="3" fill="#64748b" />
    <rect x="6" y="130" width="4" height="28" fill="#94a3b8" />
    <polygon points="4,158 12,158 8,168" fill="#cbd5e1" />
  </g>

  <g transform="translate(390, 220) rotate(25)">
    <rect x="0" y="0" width="14" height="120" rx="7" fill="#0f172a" />
    <rect x="3" y="15" width="8" height="35" rx="2" fill="#3b82f6" />
    <path d="M 7 120 L 7 150" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Nexora Service Badge -->
  <g transform="translate(250, 420)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">ORIGINAL DISPLAY</text>
  </g>
</svg>
